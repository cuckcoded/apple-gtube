name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  macos:
    name: macOS (app bundle)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: brew install --quiet mpv librsvg dylibbundler
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test
        run: swift test
      - name: Build
        run: swift build -c release --product GTube
      - name: Package
        run: packaging/bundle.sh
      - name: Smoke test
        # Loads every bundled library; Homebrew's copies are hidden first.
        run: |
          brew unlink mpv
          build/GTube.app/Contents/MacOS/GTube --version
      - uses: actions/upload-artifact@v4
        with:
          name: GTube-macos-arm64
          path: build/GTube-macos-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
