name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  macos:
    name: macOS (app bundle)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: brew install --quiet mpv librsvg dylibbundler > /dev/null
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Compile
        # Only the errors, once each, at the end of the log.
        run: |
          set +e
          swift build --build-tests > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sort -u | head -150
          exit $status
      - name: Test
        run: swift test
      - name: Build
        run: swift build -c release --product GTube
      - name: Package
        run: packaging/bundle.sh
      - name: Smoke test
        # Loads every bundled library; Homebrew's copies are hidden first.
        run: |
          brew unlink mpv
          build/GTube.app/Contents/MacOS/GTube --version
      - name: Launch test
        # Starts the app (mpv, OpenGL, the window), opens a video, and checks
        # it is still running; the log shows what happened.
        run: |
          GTUBE_MPV_AO=null build/GTube.app/Contents/MacOS/GTube "https://www.youtube.com/watch?v=jNQXAC9IVRw" &
          pid=$!
          sleep 25
          alive=0
          kill -0 $pid 2>/dev/null && alive=1
          echo "--- gtube.log"
          cat ~/Library/Logs/GTube/gtube.log || true
          kill $pid 2>/dev/null || true
          if [ $alive != 1 ]; then echo "GTube exited or crashed"; ls ~/Library/Logs/DiagnosticReports | tail -5; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: GTube-macos-arm64
          path: build/GTube-macos-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
