name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Commit the launch test's screenshots to docs/screenshots
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  macos:
    name: macOS (app bundle)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: brew install --quiet mpv librsvg dylibbundler > /dev/null
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Compile
        # Only the errors, once each, at the end of the log.
        run: |
          set +e
          swift build --build-tests > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sort -u | head -150
          exit $status
      - name: Test
        run: swift test
      - name: Build
        run: swift build -c release --product GTube
      - name: Package
        run: packaging/bundle.sh
      - name: Smoke test
        # Loads every bundled library; Homebrew's copies are hidden first.
        run: |
          brew unlink mpv
          build/GTube.app/Contents/MacOS/GTube --version
      - name: Launch test
        # Starts the app the way Finder does, checks it keeps running, and
        # prints screenshots (small JPEGs, base64) and its log.
        run: |
          shot() {
            screencapture -x "build/screen-$1.png" || return 0
            sips -Z 1600 "build/screen-$1.png" >/dev/null || true
          }
          open build/GTube.app
          sleep 30
          shot video
          open "gtube://mode/music"
          sleep 25
          shot music
          alive=0
          pgrep -x GTube >/dev/null && alive=1
          echo "--- gtube.log"
          cat ~/Library/Logs/GTube/gtube.log || true
          pkill -x GTube || true
          if [ $alive != 1 ]; then echo "GTube exited or crashed"; ls ~/Library/Logs/DiagnosticReports | tail -5; exit 1; fi
      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          mkdir -p docs/screenshots
          cp build/screen-*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Screenshots from the launch test [skip ci]" && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screen-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: GTube-macos-arm64
          path: build/GTube-macos-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
